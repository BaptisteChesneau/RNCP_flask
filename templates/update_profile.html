<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Profile - ML2C CONSEIL</title>
  <!-- Bootstrap CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <!-- Your custom CSS file if needed -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}

  <div class="container my-5">
    <h2 class="text-center mb-4">Mettre à jour vos informations personnelles</h2>
    <form action="{{ url_for('update_profile') }}" method="POST" class="mt-4">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="prenom">Prénom</label>
          <input type="text" class="form-control" id="prenom" name="prenom" value="{{ user.prenom }}" required>
        </div>
        <div class="form-group col-md-6">
          <label for="nom">Nom</label>
          <input type="text" class="form-control" id="nom" name="nom" value="{{ user.nom }}" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
      </div>
      <!-- Add additional fields if necessary -->
      <button type="submit" class="btn btn-primary">Mettre à jour</button>
    </form>
    <div class="text-center mt-4">
      <a href="{{ url_for('compte_client') }}" class="btn btn-secondary">Retour au compte</a>
    </div>
  </div>

  {% include "footer.html" %}

  <!-- Bootstrap & jQuery JS Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
