# CI pipeline: quality, security and tests.
# Triggered on every push and pull request to the main branch.
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality, security & tests
    runs-on: ubuntu-latest

    # Using remote environment variables via Secrets.
    env:
      # Injected from GitHub Secrets (never hardcode credentials).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      # A secret key is required for CSRF and signed tokens (test value only).
      SECRET_KEY: "ci-test-secret-key"
      # Disable the Secure cookie flag so the test client (HTTP) keeps sessions.
      SESSION_COOKIE_SECURE: "False"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" 
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests with pytest
        run: |
          pytest