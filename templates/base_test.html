<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test de la Base de données - Admin View</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #f0fbe4;">
  <div class="container py-5">
    <h1 class="text-center text-success mb-4">👤 User Table (Admin Access Only)</h1>

    <table class="table table-bordered table-hover bg-white">
      <thead class="thead-light">
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Password Hash</th>
        </tr>
      </thead>
      <tbody>
        {% for user in utilisateurs %}
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.nom_utilisateur }}</td>
          <td>{{ user.email }}</td>
          <td style="word-break: break-all;">{{ user.mot_de_passe_hash }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4" class="text-center text-muted">No users found.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="text-center mt-4">
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-success">⬅️ Back to Admin Dashboard</a>
    </div>
  </div>
</body>
</html>
