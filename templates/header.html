<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Header - ML2C CONSEIL</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <!-- Your custom CSS if necessary -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <!-- Main Header -->
  <header class="bg-light py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- Logo on the left (clickable to return to the menu) -->
      <a href="{{ url_for('menu') }}">
        <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Logo ML2C CONSEIL" class="img-fluid">
      </a>


      <!-- MENU CENTRÉ -->
      <nav class="text-center mt-3">
        <a href="#" class="mx-3">Notre histoire</a>
        <a href="#" class="mx-3">Notre équipe</a>
        <a href="#" class="mx-3">Nos Outils</a>
        <a href="#" class="mx-3">Nous Contacter</a>
      </nav>
      
      <!-- Right-side: either avatar if logged in, or login/signup buttons -->
      <div class="d-flex align-items-center">
        {% if session.get('user_id') %}
          <!-- Avatar displayed only when logged in -->
          <img src="{{ url_for('static', filename='images/avatar.jpg') }}"
               alt="Profil utilisateur"
               class="rounded-circle ml-3"
               style="width: 45px; height: 45px; object-fit: cover;">
        {% else %}
          <!-- Login/Signup Buttons when not logged in -->
          <button class="btn btn-primary mr-2" data-toggle="modal" data-target="#accountModal">Compte</button>
          <a href="https://app.ml2c-conseil.com/login" class="btn btn-outline-primary">Se connecter à l'application</a>
        {% endif %}
      </div>
    </div>
  </header>

  <!-- Modal for login / account creation -->
  <div class="modal fade" id="accountModal" tabindex="-1" role="dialog" aria-labelledby="accountModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="accountModalLabel">Accès Client</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <!-- Tab navigation -->
          <ul class="nav nav-tabs" id="accountTab" role="tablist">
            <li class="nav-item">
              <a class="nav-link active" id="signup-tab" data-toggle="tab" href="#signup" role="tab" aria-controls="signup" aria-selected="true">
                Create an account
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="login-tab" data-toggle="tab" href="#login" role="tab" aria-controls="login" aria-selected="false">
                Log in
              </a>
            </li>
          </ul>
          <div class="tab-content mt-3" id="accountTabContent">
            <!-- Tab for account creation -->
            <div class="tab-pane fade show active" id="signup" role="tabpanel" aria-labelledby="signup-tab">
              <form action="{{ url_for('signup') }}" method="POST">
                <div class="form-group">
                  <label for="signup-username">Username</label>
                  <input type="text" class="form-control" id="signup-username" name="username" placeholder="Enter your username">
                </div>
                <div class="form-group">
                  <label for="signup-email">Email address</label>
                  <input type="email" class="form-control" id="signup-email" name="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                  <label for="signup-password">Password</label>
                  <input type="password" class="form-control" id="signup-password" name="password" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary">Create account</button>
              </form>
              <div class="mt-3">
                <p class="mb-1">If you already have an account,</p>
                <a href="#login" data-toggle="tab" class="btn btn-secondary btn-sm">Click here</a>
              </div>
            </div>
            <!-- Tab for login -->
            <div class="tab-pane fade" id="login" role="tabpanel" aria-labelledby="login-tab">
              <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                  <label for="login-email">Email address</label>
                  <input type="email" class="form-control" id="login-email" name="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                  <label for="login-password">Password</label>
                  <input type="password" class="form-control" id="login-password" name="password" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary">Log in</button>
              </form>
              <div class="mt-3">
                <p class="mb-1">If you don't have an account yet,</p>
                <a href="#signup" data-toggle="tab" class="btn btn-secondary btn-sm">Click here</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Scripts for Bootstrap and jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
