<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Prendre Rendez-Vous - ML2C CONSEIL</title>

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
  >
  <!-- Votre CSS perso si besoin -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/styles.css') }}"
  >
</head>
<body>

  {% include "header.html" %}

  <div class="container my-4">
    <h2>Demande de Devis / Rendez-Vous</h2>
    <p>Veuillez remplir les informations ci-dessous afin de prendre rendez-vous.</p>

    <!-- Formulaire : envoi en POST vers /resume-devis -->
    <form action="{{ url_for('resume_devis') }}" method="POST">
      <!-- Secteur d'activité -->
      <div class="form-group">
        <label for="secteur">Secteur d'activité</label>
        <input
          type="text"
          class="form-control"
          id="secteur"
          name="secteur"
          placeholder="Ex: Commerce, Informatique, Artisanat..."
          required
        >
      </div>

      <!-- Nom -->
      <div class="form-group">
        <label for="nom">Nom / Raison sociale</label>
        <input
          type="text"
          class="form-control"
          id="nom"
          name="nom"
          placeholder="Ex: Dupont SARL"
          required
        >
      </div>

      <!-- Type de service (menu déroulant) -->
      <div class="form-group">
        <label for="type_service">Type de service</label>
        <select
          class="form-control"
          id="type_service"
          name="type_service"
          required
        >
          <option value="">-- Sélectionnez un service --</option>
          <option value="Conseil Juridique">Conseil Juridique</option>
          <option value="Conseil Fiscal">Conseil Fiscal</option>
          <option value="Création d'entreprise">Création d'entreprise</option>
          <option value="Audit Complet">Audit Complet</option>
          <option value="Autre">Autre (à préciser)</option>
        </select>
      </div>

      <!-- Date et heure du rendez-vous -->
      <div class="form-row">
        <!-- Date -->
        <div class="form-group col-md-6">
          <label for="date_rdv">Date du rendez-vous</label>
          <input
            type="date"
            class="form-control"
            id="date_rdv"
            name="date_rdv"
            required
          >
        </div>
        <!-- Heure -->
        <div class="form-group col-md-6">
          <label for="heure_rdv">Heure du rendez-vous</label>
          <input
            type="time"
            class="form-control"
            id="heure_rdv"
            name="heure_rdv"
            required
          >
        </div>
      </div>

      <!-- Bouton Valider -->
      <button type="submit" class="btn btn-primary">
        Valider
      </button>
    </form>
  </div>

  {% include "footer.html" %}

  <!-- Scripts Bootstrap & jQuery (pour l’UI, si besoin) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
