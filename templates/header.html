<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Header - ML2C CONSEIL</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <!-- Votre CSS personnalisé si nécessaire -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <!-- Header principal -->
  <header class="bg-light py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- Logo à gauche (cliquable pour revenir au menu) -->
      <a href="{{ url_for('menu') }}">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo ML2C CONSEIL" class="img-fluid">
      </a>
      <!-- Titre centré -->
      <h1 class="m-0 text-center flex-grow-1">ML2C CONSEIL</h1>
      <!-- Boutons de navigation pour la connexion et l'inscription -->
      <div>
        <a href="{{ url_for('login') }}" class="btn btn-outline-primary mr-2">Se connecter</a>
        <a href="{{ url_for('signup') }}" class="btn btn-primary">Créer un compte</a>
      </div>
    </div>
  </header>

  <!-- Scripts JS Bootstrap et jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
