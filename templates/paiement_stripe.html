<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stripe Payment - ML2C CONSEIL</title>
  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
  >
  <!-- Custom styles if needed -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/styles.css') }}"
  >
</head>
<body>

  {% include "header.html" %}

  <!-- Navigation tabs -->
  <ul class="nav nav-tabs" id="paiementTabs" role="tablist">
    <li class="nav-item">
      <a class="nav-link active" id="home-tab" data-toggle="tab" href="#home" role="tab">Home</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" id="facturation-tab" data-toggle="tab" href="#facturation" role="tab">Billing</a>
    </li>
  </ul>
  
  <!-- Tab content -->
  <div class="tab-content" id="paiementTabsContent">
  
    <!-- Home tab -->
    <div class="tab-pane fade show active" id="home" role="tabpanel">
      <div class="container my-4">
        <h3>Welcome</h3>
        <p>This is the home tab.</p>
      </div>
    </div>
  
    <!-- Billing tab with form -->
    <div class="tab-pane fade" id="facturation" role="tabpanel">
      <div class="container my-4">
        <h2>Payment via Stripe</h2>
        <p>Please enter your payment information:</p>
  
        <!-- Credit card form fields -->
        <form action="#" method="POST">
          <!-- Cardholder's full name -->
          <div class="form-group">
            <label for="card_holder_name">Cardholder's name</label>
            <input
              type="text"
              class="form-control"
              id="card_holder_name"
              name="card_holder_name"
              placeholder="Ex: Dupont Jean"
              required
            >
          </div>

          <!-- Card number -->
          <div class="form-group">
            <label for="card_number">Card number</label>
            <input
              type="text"
              class="form-control"
              id="card_number"
              name="card_number"
              placeholder="XXXX XXXX XXXX XXXX"
              required
            >
          </div>

          <!-- Expiration date and CVV -->
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="card_expiry">Expiration date</label>
              <input
                type="text"
                class="form-control"
                id="card_expiry"
                name="card_expiry"
                placeholder="MM/YY"
                required
              >
            </div>
            <div class="form-group col-md-6">
              <label for="card_cvv">CVV</label>
              <input
                type="text"
                class="form-control"
                id="card_cvv"
                name="card_cvv"
                placeholder="3 or 4 digits"
                required
              >
            </div>
          </div>

          <!-- Pay button -->
          <button type="submit" class="btn btn-primary">Pay</button>
        </form>

        <!-- Buttons: Back to menu and Send to settings -->
        <div class="d-flex justify-content-center justify-content-md-end mt-4 flex-wrap gap-2">
          <a href="{{ url_for('menu') }}" class="btn btn-secondary mr-2">Back to menu</a>
          <a href="{{ url_for('parametres') }}" id="btn-parametres" class="btn btn-warning d-none">Send to settings</a>
        </div>
      </div>
    </div>
  </div>  

  {% include "footer.html" %}

  <!-- Bootstrap + jQuery scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script to show the button only in the Billing tab -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      $('a[data-toggle="tab"]').on('shown.bs.tab', function (e) {
        const target = $(e.target).attr('href');
        const bouton = document.getElementById('btn-parametres');

        if (target === '#facturation') {
          bouton.classList.remove('d-none');
        } else {
          bouton.classList.add('d-none');
        }
      });

      // Show the button and activate the tab if URL contains #facturation
      if (window.location.hash === '#facturation') {
        const bouton = document.getElementById('btn-parametres');
        if (bouton) bouton.classList.remove('d-none');

        const triggerTab = document.querySelector('a[href="#facturation"]');
        if (triggerTab) {
          $(triggerTab).tab('show');
        }
      }
    });
  </script>
</body>
</html>
