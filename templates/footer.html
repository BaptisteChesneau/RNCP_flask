<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ML2C CONSEIL - Footer</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">

  <!-- Font Awesome (optionnel) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

  <!-- FOOTER -->
  <footer class="footer-custom">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">

      <!-- GAUCHE : Réseaux sociaux -->
      <div class="footer-left d-flex align-items-center">
        <a href="https://www.facebook.com" class="mr-3" title="Facebook">
          <img src="{{ url_for('static', filename='images/facebook.PNG') }}" alt="Facebook">
        </a>
        <a href="https://www.linkedin.com" class="mr-3" title="LinkedIn">
          <img src="{{ url_for('static', filename='images/linkedin.PNG') }}" alt="LinkedIn">
        </a>
        <a href="https://www.instagram.com" title="Instagram">
          <img src="{{ url_for('static', filename='images/instagram.PNG') }}" alt="Instagram">
        </a>
      </div>

      <!-- CENTRE : Coordonnées -->
      <div class="footer-middle text-center d-flex flex-column">
        <span>6, Rue de la vigne, 28360 Dammarie</span>
        <span>contact@ml2cconseil.com</span>
        <span>+33 (0)6 72 34 32 94</span>
      </div>

    <!-- DROITE : Liens -->
    <!-- On force la couleur blanche (et non bleue) avec style="color: white;" -->
    <div class="footer-right-horizontal d-flex justify-content-end align-items-center">
      <!-- Force white text via inline style -->
      <a href="{{ url_for('rgpd') }}" class="btn btn-link" style="color: white;">RGPD</a>
      <a href="{{ url_for('mentions_legales') }}" class="btn btn-link" style="color: white;">Mentions légales</a>      
      <a href="{{ url_for('aide') }}" class="btn btn-link" style="color: white;">Aide</a>
    </div>

    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
