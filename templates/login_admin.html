<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Admin - ML2C CONSEIL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container my-5">
  <h1 class="text-center mb-4">Connexion Administrateur 🔒</h1>

  <form method="POST" class="mb-5" style="max-width: 400px; margin: 0 auto;">
    <div class="form-group">
      <label for="username">Nom d'utilisateur :</label>
      <input type="text" class="form-control" id="username" name="username" required>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe :</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
  </form>

  <div class="text-center">
    <a href="{{ url_for('chatbot') }}" class="btn btn-secondary">Retour au Chatbot</a>
  </div>
</div>

</body>
</html>
