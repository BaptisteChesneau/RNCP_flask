<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un Collaborateur — ML2C CONSEIL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <style>
    body {
      background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }

    .form-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #b81473, #6a0944);
    }

    .btn-custom {
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, #b81473, #8c0f57);
      border: none;
      color: #ffffff;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background: linear-gradient(135deg, #a01063, #750b48);
      color: #ffffff;
    }
  </style>
</head>
<body>

<main class="container p-3 d-flex justify-content-center">
  <div class="form-card p-4 p-sm-5">
    
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-2" style="width: 56px; height: 56px; background: rgba(184,20,115,0.1); color: #b81473; border-radius: 50%; font-size: 1.4rem;">
        <i class="fas fa-user-plus"></i>
      </div>
      <h4 class="font-weight-bold mb-1" style="color: #1a202c;">Nouveau Collaborateur</h4>
      <p class="text-muted small">Création d'un accès membre pour ML2C CONSEIL</p>
    </div>

    <!-- Messages Flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show rounded-lg small" role="alert">
            {{ message }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Fermer">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('creer_collaborateur') }}">
      
      <div class="form-row">
        <div class="form-group col-md-6 mb-3">
          <label class="small font-weight-bold text-dark mb-1">Prénom</label>
          <input type="text" class="form-control" name="prenom" required placeholder="Sebastien">
        </div>
        <div class="form-group col-md-6 mb-3">
          <label class="small font-weight-bold text-dark mb-1">Nom</label>
          <input type="text" class="form-control" name="nom" required placeholder="Chesneau">
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="small font-weight-bold text-dark mb-1">E-mail Professionnel</label>
        <input type="email" class="form-control" name="email" required placeholder="collaborateur@ml2c-conseil.com">
      </div>

      <div class="form-group mb-4">
        <label class="small font-weight-bold text-dark mb-1">Mot de passe temporaire</label>
        <input type="password" class="form-control" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-custom btn-block mb-3">
        Créer le compte Collaborateur <i class="fas fa-check-circle ml-2"></i>
      </button>

      <div class="text-center">
        <a href="{{ url_for('collaborateur_login') }}" class="small text-muted text-decoration-none">
          <i class="fas fa-arrow-left mr-1"></i> Aller au Portail de connexion
        </a>
      </div>

    </form>
  </div>
</main>

</body>
</html>
