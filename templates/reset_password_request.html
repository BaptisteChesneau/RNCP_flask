<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réinitialisation du Mot de Passe - ML2C CONSEIL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}
  <div class="container my-5">
    <h2 class="mb-4">Réinitialisation du Mot de Passe</h2>
    <p>Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>
    <form action="{{ url_for('reset_password_request') }}" method="POST">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="exemple@domaine.com" required>
      </div>
      <button type="submit" class="btn btn-primary">Envoyer le lien de réinitialisation</button>
    </form>
    <div class="text-center mt-4">
      <a href="{{ url_for('menu') }}" class="btn btn-secondary">Retour au menu</a>
    </div>
  </div>
  {% include "footer.html" %}
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
