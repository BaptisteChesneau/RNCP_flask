<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit User</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <div class="container py-5">

    <h2 class="text-center text-primary mb-4">
      <i class="fas fa-edit"></i> Edit User Profile
    </h2>

    <form method="POST" action="{{ url_for('update_user', user_id=user.id) }}">
      {{ form.hidden_tag() }}

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ user.nom_utilisateur }}" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
      </div>

      <div class="form-group">
        <label for="password">New Password (leave blank to keep existing)</label>
        <input type="password" class="form-control" id="password" name="password">
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success">
          <i class="fas fa-save"></i> Save Changes
        </button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary ml-2">
          <i class="fas fa-times"></i> Cancel
        </a>
      </div>
    </form>

  </div>

</body>
</html>
