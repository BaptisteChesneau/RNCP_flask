<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ML2C CONSEIL - Header</title>
  <!-- Intégration de Bootstrap 4.5.2 (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
</head>
<body>

  <!-- HEADER -->
  <header class="bg-light py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- Logo (gauche) -->
      <img src="https://via.placeholder.com/80" alt="Logo ML2C CONSEIL" class="img-fluid">

      <!-- Titre (milieu) -->
      <h1 class="m-0">ML2C CONSEIL</h1>

      <!-- Bouton (droite) -->
      <button 
        class="btn btn-primary" 
        type="button" 
        data-toggle="collapse" 
        data-target="#createAccountCollapse" 
        aria-expanded="false" 
        aria-controls="createAccountCollapse"
      >
        Créer un compte
      </button>
    </div>
  </header>

  <!-- SECTION COLLAPSIBLE (Slider) POUR CRÉER UN COMPTE -->
  <div class="collapse bg-secondary text-white p-4" id="createAccountCollapse">
    <div class="container">
      <h2>Formulaire de création de compte</h2>
      <form>
        <div class="form-group">
          <label for="username">Nom d'utilisateur :</label>
          <input type="text" class="form-control" id="username" placeholder="Entrez votre nom d'utilisateur">
        </div>
        <div class="form-group">
          <label for="email">Adresse e-mail :</label>
          <input type="email" class="form-control" id="email" placeholder="Entrez votre e-mail">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe :</label>
          <input type="password" class="form-control" id="password" placeholder="Entrez votre mot de passe">
        </div>
        <button type="submit" class="btn btn-light mt-2">Créer le compte</button>
      </form>
    </div>
  </div>

  <!-- Scripts JS (Bootstrap 4, Popper.js, jQuery) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
