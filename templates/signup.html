<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un compte - ML2C CONSEIL</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <!-- Votre CSS personnalisé -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}
  
  <div class="container my-5">
    <h2 class="text-center mb-4">Créer un compte</h2>
    <form action="{{ url_for('signup') }}" method="POST">
      <div class="form-group">
        <label for="signup-username">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="signup-username" name="username" placeholder="Entrez votre nom d'utilisateur" required>
      </div>
      <div class="form-group">
        <label for="signup-email">Adresse e-mail</label>
        <input type="email" class="form-control" id="signup-email" name="email" placeholder="Entrez votre e-mail" required>
      </div>
      <div class="form-group">
        <label for="signup-password">Mot de passe</label>
        <input type="password" class="form-control" id="signup-password" name="password" placeholder="Entrez votre mot de passe" required>
      </div>
      <button type="submit" class="btn btn-primary">Créer le compte</button>
    </form>
    <div class="mt-3">
      <p>Vous avez déjà un compte ?</p>
      <a href="{{ url_for('login') }}" class="btn btn-secondary btn-sm">Cliquez ici</a>
    </div>
  </div>
  
  {% include "footer.html" %}
  
  <!-- Scripts JS Bootstrap -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
