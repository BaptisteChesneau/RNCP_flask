<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Collaborateur — ML2C CONSEIL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <style>
    body {
      background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      overflow: hidden;
      max-width: 440px;
      width: 100%;
      position: relative;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #b81473, #6a0944);
    }

    .icon-badge {
      width: 64px;
      height: 64px;
      background: rgba(184, 20, 115, 0.1);
      color: #b81473;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 1.5rem;
    }

    .custom-input-group {
      display: flex;
      align-items: center;
      border: 1.5px solid #cbd5e0;
      border-radius: 10px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .custom-input-group:focus-within {
      border-color: #b81473;
      box-shadow: 0 0 0 4px rgba(184, 20, 115, 0.15);
    }

    .input-group-prepend-icon {
      background-color: rgba(184, 20, 115, 0.08);
      color: #b81473;
      padding: 0 16px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border-right: 1px solid #cbd5e0;
      min-width: 52px;
    }

    .form-control-custom {
      height: 50px;
      border: none;
      background: transparent;
      padding: 0 14px;
      font-size: 0.95rem;
      color: #2d3748;
      width: 100%;
    }

    .form-control-custom:focus {
      outline: none;
    }

    .toggle-password-btn {
      background: transparent;
      border: none;
      color: #4a5568;
      padding: 0 16px;
      cursor: pointer;
      height: 50px;
    }

    .btn-custom {
      height: 50px;
      border-radius: 10px;
      background: linear-gradient(135deg, #b81473, #8c0f57);
      border: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(184, 20, 115, 0.25);
    }

    .btn-custom:hover {
      background: linear-gradient(135deg, #a01063, #750b48);
      transform: translateY(-2px);
      color: #ffffff;
    }
  </style>
</head>
<body>

<main class="container p-3 d-flex justify-content-center">
  <div class="auth-card p-4 p-sm-5">
    
    <div class="icon-badge">
      <i class="fas fa-user-tie"></i>
    </div>

    <h3 class="text-center font-weight-bold mb-1" style="color: #1a202c;">ML2C CONSEIL</h3>
    <p class="text-center text-muted small mb-4">Portail Collaborateurs & Administration</p>

    <!-- Messages Flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show rounded-lg small" role="alert">
            {{ message }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Fermer">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('collaborateur_login') }}">
      
      <!-- Email Pro -->
      <div class="form-group mb-3">
        <label for="email" class="small font-weight-bold text-uppercase text-dark mb-2">Identifiant Pro</label>
        <div class="custom-input-group">
          <div class="input-group-prepend-icon">
            <i class="fas fa-envelope"></i>
          </div>
          <input 
            type="email" 
            class="form-control-custom" 
            id="email" 
            name="email" 
            required 
            placeholder="collaborateur@ml2c-conseil.com"
          >
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group mb-4">
        <label for="password" class="small font-weight-bold text-uppercase text-dark mb-2">Mot de passe</label>
        <div class="custom-input-group">
          <div class="input-group-prepend-icon">
            <i class="fas fa-lock"></i>
          </div>
          <input 
            type="password" 
            class="form-control-custom" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••"
          >
          <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-custom btn-block mb-3">
        Connexion Collaborateur <i class="fas fa-arrow-right ml-2 small"></i>
      </button>

      <div class="text-center">
        <a href="{{ url_for('login') }}" class="small text-muted text-decoration-none">
          <i class="fas fa-user-circle mr-1"></i> Accès Espace Client
        </a>
      </div>
    </form>

  </div>
</main>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  }
</script>
</body>
</html>
