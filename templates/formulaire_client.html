<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Formulaire Client - ML2C CONSEIL</title>

  <!-- Bootstrap CSS (CDN) -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
  >
  <!-- Votre fichier CSS si nécessaire -->
  <link 
    rel="stylesheet" 
    href="{{ url_for('static', filename='css/styles.css') }}"
  >
</head>
<body>

  {% include "header.html" %}

  <div class="container my-4">
    <h2>Formulaire de création de fiche client</h2>
    
    <!-- Début du formulaire : on pointe vers la route Flask /formulaire_client en POST -->
    <form action="{{ url_for('formulaire_client') }}" method="POST" class="mt-4">
      
      <!-- Nature de l'activité -->
      <div class="form-group">
        <label for="activite">Nature de l'activité</label>
        <input 
          type="text" 
          class="form-control" 
          id="activite" 
          name="activite" 
          placeholder="Ex: Conseil, Vente, Artisanat..."
          required
        >
      </div>

      <!-- Type d'entreprise -->
      <div class="form-group">
        <label for="type_entreprise">Type d'entreprise</label>
        <select 
          class="form-control" 
          id="type_entreprise" 
          name="type_entreprise"
          required
        >
          <option value="">-- Sélectionnez un type --</option>
          <option value="SAS">SAS</option>
          <option value="SARL">SARL</option>
          <option value="Auto-entrepreneur">Auto-entrepreneur</option>
          <option value="Association">Association</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <!-- Nom du cabinet d'où il vient -->
      <div class="form-group">
        <label for="cabinet">Nom du cabinet</label>
        <input 
          type="text" 
          class="form-control" 
          id="cabinet" 
          name="cabinet" 
          placeholder="Ex: Cabinet Dupont"
          required
        >
      </div>

      <!-- Civilité : Homme/Femme -->
      <div class="form-group">
        <label>Civilité :</label>
        <div class="form-check">
          <input 
            class="form-check-input" 
            type="radio" 
            name="civilite" 
            id="monsieur" 
            value="Monsieur"
            required
          >
          <label class="form-check-label" for="monsieur">
            M.
          </label>
        </div>
        <div class="form-check">
          <input 
            class="form-check-input" 
            type="radio" 
            name="civilite" 
            id="madame" 
            value="Madame"
          >
          <label class="form-check-label" for="madame">
            Mme
          </label>
        </div>
      </div>

      <!-- Nom et prénom -->
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="nom">Nom</label>
          <input 
            type="text" 
            class="form-control" 
            id="nom" 
            name="nom" 
            placeholder="Ex: Durand"
            required
          >
        </div>
        <div class="form-group col-md-6">
          <label for="prenom">Prénom</label>
          <input 
            type="text" 
            class="form-control" 
            id="prenom" 
            name="prenom" 
            placeholder="Ex: Marie"
            required
          >
        </div>
      </div>

      <!-- Adresse e-mail -->
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          name="email"
          placeholder="exemple@domaine.com"
          required
        >
      </div>

      <!-- Adresse du siège social -->
      <div class="form-group">
        <label for="adresse_siege">Adresse du siège social</label>
        <input 
          type="text" 
          class="form-control" 
          id="adresse_siege" 
          name="adresse_siege"
          placeholder="Ex: 123 Rue de l'Entreprise, 75000 Paris"
          required
        >
      </div>

      <!-- Bouton de soumission -->
      <button type="submit" class="btn btn-primary">
        Envoyer
      </button>
    </form>
  </div>

    <!-- Bouton Retour au menu -->
    <div class="text-center mt-4">
      <a href="{{ url_for('menu') }}" class="btn btn-secondary">Retour au menu</a>
    </div>
  </div>
  
  {% include "footer.html" %}

  <!-- Scripts JS (Bootstrap + jQuery) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
