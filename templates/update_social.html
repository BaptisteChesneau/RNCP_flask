<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mise à jour des réseaux sociaux - ML2C CONSEIL</title>
  <!-- Bootstrap CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <!-- Votre fichier CSS personnalisé -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}

  <div class="container my-5">
    <h2 class="text-center mb-4">Mise à jour de vos réseaux sociaux</h2>
    <form action="{{ url_for('update_social') }}" method="POST" class="mt-4">
      <div class="form-group">
        <label for="facebook">Facebook</label>
        <input type="url" class="form-control" id="facebook" name="facebook" placeholder="https://www.facebook.com/votrepseudo">
      </div>
      <div class="form-group">
        <label for="linkedin">LinkedIn</label>
        <input type="url" class="form-control" id="linkedin" name="linkedin" placeholder="https://www.linkedin.com/in/votrepseudo">
      </div>
      <div class="form-group">
        <label for="instagram">Instagram</label>
        <input type="url" class="form-control" id="instagram" name="instagram" placeholder="https://www.instagram.com/votrepseudo">
      </div>
      <!-- Ajoutez d'autres champs si nécessaire -->
      <button type="submit" class="btn btn-primary">Mettre à jour mes réseaux sociaux</button>
    </form>
    <div class="text-center mt-4">
      <a href="{{ url_for('parametres') }}" class="btn btn-secondary">Retour aux paramètres</a>
    </div>
  </div>

  {% include "footer.html" %}

  <!-- Bootstrap & jQuery JS Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
