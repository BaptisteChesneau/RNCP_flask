<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réinitialiser le Mot de Passe - ML2C CONSEIL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}
  <div class="container my-5">
    <h2 class="mb-4">Réinitialiser le Mot de Passe</h2>
    <form action="{{ url_for('reset_password', token=token) }}" method="POST">
      <div class="form-group">
        <label for="new_password">Nouveau mot de passe</label>
        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Entrez votre nouveau mot de passe" required>
      </div>
      <button type="submit" class="btn btn-primary">Réinitialiser</button>
    </form>
    <div class="text-center mt-4">
      <a href="{{ url_for('menu') }}" class="btn btn-secondary">Retour au menu</a>
    </div>
  </div>
  {% include "footer.html" %}
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
