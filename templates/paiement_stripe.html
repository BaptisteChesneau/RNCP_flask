<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paiement Stripe - ML2C CONSEIL</title>
  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
  >
  <!-- Styles personnalisés si nécessaire -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/styles.css') }}"
  >
</head>
<body>

  {% include "header.html" %}

  <!-- Onglets de navigation -->
  <ul class="nav nav-tabs" id="paiementTabs" role="tablist">
    <li class="nav-item">
      <a class="nav-link active" id="home-tab" data-toggle="tab" href="#home" role="tab">Accueil</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" id="facturation-tab" data-toggle="tab" href="#facturation" role="tab">Facturation</a>
    </li>
  </ul>
  
  <!-- Contenu des onglets -->
  <div class="tab-content" id="paiementTabsContent">
  
    <!-- Onglet Accueil -->
    <div class="tab-pane fade show active" id="home" role="tabpanel">
      <div class="container my-4">
        <h3>Bienvenue</h3>
        <p>Ceci est l'onglet d'accueil.</p>
      </div>
    </div>
  
    <!-- Onglet Facturation avec formulaire -->
    <div class="tab-pane fade" id="facturation" role="tabpanel">
      <div class="container my-4">
        <h2>Paiement via Stripe</h2>
        <p>Veuillez renseigner vos informations de paiement :</p>
  
<!-- Formulaire champs carte bancaire -->
<form action="#" method="POST">
  <!-- Nom et prénom du possesseur de la carte -->
  <div class="form-group">
    <label for="card_holder_name">Nom du titulaire de la carte</label>
    <input
      type="text"
      class="form-control"
      id="card_holder_name"
      name="card_holder_name"
      placeholder="Ex: Dupont Jean"
      required
    >
  </div>

  <!-- Numéro de carte -->
  <div class="form-group">
    <label for="card_number">Numéro de carte</label>
    <input
      type="text"
      class="form-control"
      id="card_number"
      name="card_number"
      placeholder="XXXX XXXX XXXX XXXX"
      required
    >
  </div>

  <!-- Date d'expiration et CVV -->
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="card_expiry">Date d'expiration</label>
      <input
        type="text"
        class="form-control"
        id="card_expiry"
        name="card_expiry"
        placeholder="MM/AA"
        required
      >
    </div>
    <div class="form-group col-md-6">
      <label for="card_cvv">CVV</label>
      <input
        type="text"
        class="form-control"
        id="card_cvv"
        name="card_cvv"
        placeholder="3 ou 4 chiffres"
        required
      >
    </div>
  </div>

  <!-- Bouton de paiement -->
  <button type="submit" class="btn btn-primary">Payer</button>
</form>

  
        <!-- Boutons : Retour au menu et Envoyer vers paramètres -->
        <div class="d-flex justify-content-center justify-content-md-end mt-4 flex-wrap gap-2">
          <a href="{{ url_for('menu') }}" class="btn btn-secondary mr-2">Retour au menu</a>
          <a href="{{ url_for('parametres') }}" id="btn-parametres" class="btn btn-warning d-none">Envoyer vers paramètres</a>
        </div>
      </div>
    </div>
  </div>  

  {% include "footer.html" %}

<!-- Scripts Bootstrap + jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script pour afficher le bouton uniquement dans l’onglet Facturation -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    $('a[data-toggle="tab"]').on('shown.bs.tab', function (e) {
      const target = $(e.target).attr('href');
      const bouton = document.getElementById('btn-parametres');

      if (target === '#facturation') {
        bouton.classList.remove('d-none');
      } else {
        bouton.classList.add('d-none');
      }
    });

    // Afficher le bouton et activer l'onglet si l'URL contient #facturation
    if (window.location.hash === '#facturation') {
      const bouton = document.getElementById('btn-parametres');
      if (bouton) bouton.classList.remove('d-none');

      const triggerTab = document.querySelector('a[href="#facturation"]');
      if (triggerTab) {
        $(triggerTab).tab('show');
      }
    }
  });
</script>
</body>
</html>
