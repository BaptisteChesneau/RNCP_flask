<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explain SQL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <div class="container py-5">
    <h1 class="text-primary mb-4">
      🧠 SQL Explanation
    </h1>

    <form method="POST" action="{{ url_for('explain_sql') }}">
      <div class="mb-3">
        <label for="query" class="form-label"><strong>Your SQL Query:</strong></label>
        <textarea name="query" id="query" rows="4" class="form-control" required>{{ query or '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Explain</button>
    </form>

    {% if query %}
      <div class="mt-4">
        <p><strong>Query:</strong></p>
        <pre class="sql-code">{{ query }}</pre>

        <h5 class="mt-4">🔍 What this query does</h5>
        <div class="alert alert-secondary">
          {{ explanation }}
        </div>
      </div>
    {% endif %}

    <div class="mt-4">
      <a href="{{ url_for('admin_view') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left"></i> Back to Admin Panel
      </a>
    </div>
  </div>

</body>
</html>
