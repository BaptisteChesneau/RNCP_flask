<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Notifications - ML2C CONSEIL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}

  <div class="container my-5">
    <h2>Notifications</h2>
    <form action="{{ url_for('update_notifications') }}" method="POST">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="notif_email" name="notif_email" checked>
        <label class="form-check-label" for="notif_email">
          Recevoir les notifications par email
        </label>
      </div>
      <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" id="notif_sms" name="notif_sms">
        <label class="form-check-label" for="notif_sms">
          Recevoir les notifications par SMS
        </label>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Mettre à jour</button>
    </form>
  </div>

  {% include "footer.html" %}
</body>
</html>
