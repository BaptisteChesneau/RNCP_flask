<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ML2C CONSEIL - Footer</title>

  <!-- Intégration de Bootstrap (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">

  <!-- Intégration de Font Awesome (pour les icônes) -->
  <!-- (Optionnel si vous n'utilisez plus Font Awesome pour les réseaux sociaux) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

  <!-- FOOTER -->
  <footer class="bg-dark text-white py-4">
    <div class="container d-flex justify-content-between align-items-center">
      
      <!-- GAUCHE : Icônes réseaux sociaux -->
      <div>
        <!-- Remplacez "#" par les liens de vos pages Facebook, LinkedIn, Instagram -->
        <a href="https://www.facebook.com" class="text-white mr-3">
          <img src="{{ url_for('static', filename='images/facebook.webp') }}" alt="Facebook" style="width: 24px; height: auto;">
        </a>
        <a href="https://www.linkedin.com" class="text-white mr-3">
          <img src="{{ url_for('static', filename='images/linkedin.webp') }}" alt="LinkedIn" style="width: 24px; height: auto;">
        </a>
        <a href="https://www.instagram.com" class="text-white mr-3">
          <img src="{{ url_for('static', filename='images/instagram.webp') }}" alt="Instagram" style="width: 24px; height: auto;">
        </a>
      </div>

      <!-- MILIEU : Adresse, e-mail, téléphone -->
      <div class="text-center">
        <p class="mb-1">6, Rue de la vigne, 28360 Dammarie</p>
        <p class="mb-1">contact@ml2cconseil.com</p>
        <p class="mb-0">+33 (0)6 72 34 32 94</p>
      </div>

      <!-- DROITE : Liens RGPD & Mentions légales -->
      <div>
        <a href="#" class="btn btn-link text-white">RGPD</a>
        <a href="#" class="btn btn-link text-white">Mentions légales</a>
      </div>

    </div>
  </footer>

  <!-- Scripts JS Bootstrap + jQuery (pour le bon fonctionnement des composants) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
