<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Facturation - ML2C CONSEIL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}

  <div class="container my-5">
    <h2>Facturation</h2>
    <form action="{{ url_for('update_billing') }}" method="POST">
      <div class="form-group">
        <label for="billing_name">Nom de facturation</label>
        <input type="text" class="form-control" id="billing_name" name="billing_name" required>
      </div>
      <div class="form-group">
        <label for="billing_address">Adresse de facturation</label>
        <input type="text" class="form-control" id="billing_address" name="billing_address" required>
      </div>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>
  </div>

  {% include "footer.html" %}
</body>
</html>
