<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Update Password - ML2C CONSEIL</title>
  <!-- Bootstrap CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
  <!-- Your custom CSS file if needed -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% include "header.html" %}

  <div class="container my-5">
    <h2 class="text-center mb-4">Changer votre mot de passe</h2>
    <form action="{{ url_for('update_password') }}" method="POST" class="mt-4">
      <div class="form-group">
        <label for="current_password">Mot de passe actuel</label>
        <input type="password" class="form-control" id="current_password" name="current_password" required>
      </div>
      <div class="form-group">
        <label for="new_password">Nouveau mot de passe</label>
        <input type="password" class="form-control" id="new_password" name="new_password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirmez le nouveau mot de passe</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary">Mettre à jour</button>
    </form>
    <div class="text-center mt-4">
      <a href="{{ url_for('compte_client') }}" class="btn btn-secondary">Retour au compte</a>
    </div>
  </div>

  {% include "footer.html" %}

  <!-- Bootstrap & jQuery JS Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
